<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — fused overview screen (issue #6)</title>
<!--
  THROWAWAY PROTOTYPE for https://github.com/Commander-Cody/weather-page/issues/6
  Three variants of the fused overview screen (wind + rain + water level on one
  time axis), switchable via ?variant=A|B|C and the floating bar at the bottom.

  All data is FAKE but shaped like the real thing:
    - water in cm above gauge zero (Husum: MHW 672, MNW 324), 20-min grid
    - astronomical + surge-corrected forecast stop at the SAME timestamp, +136 h
    - measurement only reaches ~13 h into the past
    - weather axis runs 7 days, so it overshoots the water by ~1.3 days
    - a storm sits at about +58 h so wind, rain and surge peak together

  Labels are REDACTED on purpose. The page is Frisian-only, so it has to read
  from shape and number first. Press L (or the eye button) to reveal German
  stand-ins and see how much you were leaning on the words.
-->
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --ink: #14181f;
    --ink-2: #5b6472;
    --ink-3: #9aa3b0;
    --line: #e3e6eb;
    --wind: #4b5a86;
    --wind-soft: #b9c2db;
    --rain: #2f7fc4;
    --rain-soft: #bcd9ef;
    --sea: #0f6b6b;
    --sea-soft: #9fcccc;
    --astro: #8d98a6;
    --surge-hi: #d1683a;
    --surge-lo: #4a8fbf;
    --nodata: #c6ccd6;
    --night: #eceff4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #2a2e35;
    color: var(--ink);
    font: 15px/1.35 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px 12px 110px;
    display: flex;
    justify-content: center;
  }
  /* the phone. 390px is the design target. */
  #phone {
    width: 390px;
    min-height: 780px;
    background: var(--bg);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,.45);
    position: relative;
  }
  /* the fold: everything below this line needs a scroll on a small phone */
  #fold {
    position: absolute; left: 0; right: 0; top: 700px;
    border-top: 1px dashed rgba(210,60,60,.55);
    pointer-events: none; z-index: 5;
  }
  #fold::after {
    content: "fold — 390×700";
    position: absolute; right: 6px; top: 3px;
    font: 9px/1 ui-monospace, monospace; color: rgba(210,60,60,.75);
  }

  .pad { padding: 0 14px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  .muted { color: var(--ink-2); }
  .tiny { font-size: 11px; }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ---- redaction. this is the point, not a placeholder for a placeholder ---- */
  .ph { position: relative; white-space: nowrap; }
  body:not(.reveal) .ph { color: transparent !important; }
  body:not(.reveal) .ph::before {
    content: "";
    position: absolute; left: 0; top: 14%; right: 0; bottom: 16%;
    background: #8b95a4;
    opacity: .34;
    border-radius: 3px;
  }

  /* ---- header ---- */
  header { padding: 14px 14px 8px; }
  .place { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .place-sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
  .stamp { font-size: 11px; color: var(--ink-3); margin-top: 6px; }

  /* ---- the "now" row, shared shape across variants but styled per variant ---- */
  .now-row { display: flex; gap: 8px; }
  .now-cell { flex: 1; background: var(--card); border-radius: 12px; padding: 10px 8px; }
  .now-val { font-size: 21px; font-weight: 650; line-height: 1.05; }
  .now-unit { font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .now-cap { font-size: 11px; margin-top: 4px; }

  svg { display: block; }
  .scroller { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
  .scroller::-webkit-scrollbar { height: 4px; }
  .scroller::-webkit-scrollbar-thumb { background: var(--ink-3); border-radius: 2px; }

  .lane-label { font-size: 11px; font-weight: 600; color: var(--ink-2); margin: 0 0 2px 2px; }

  table.rows { width: 100%; border-collapse: collapse; }
  table.rows td { padding: 0; vertical-align: middle; }

  /* ---- switcher ---- */
  #bar {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 0;
    background: #10131a; color: #fff;
    border-radius: 999px;
    box-shadow: 0 8px 28px rgba(0,0,0,.5);
    font: 13px/1 -apple-system, "Segoe UI", Roboto, sans-serif;
    z-index: 100; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
  }
  #bar button {
    background: none; border: 0; color: #fff; cursor: pointer;
    padding: 0 15px; font-size: 15px; line-height: 1;
    display: flex; align-items: center;
  }
  #bar button:hover { background: rgba(255,255,255,.12); }
  #bar .name {
    padding: 12px 10px; min-width: 232px; text-align: center;
    display: flex; flex-direction: column; gap: 3px; justify-content: center;
  }
  #bar .name b { font-size: 13px; font-weight: 600; }
  #bar .name span { font-size: 10px; opacity: .55; letter-spacing: .04em; text-transform: uppercase; }
  #bar .sep { width: 1px; background: rgba(255,255,255,.16); }
  #bar .tag {
    position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    background: #d1683a; color: #fff; font-size: 9px; font-weight: 700;
    letter-spacing: .1em; padding: 2px 8px; border-radius: 999px;
  }
  #bar.reveal-on #eye { background: rgba(255,255,255,.2); }
</style>
</head>
<body>

<div id="phone">
  <div id="fold"></div>
  <div id="app"></div>
</div>

<div id="bar">
  <div class="tag">PROTOTYPE</div>
  <button id="prev" title="previous variant (←)">◀</button>
  <div class="sep"></div>
  <div class="name"><b id="vname">—</b><span id="vkey">—</span></div>
  <div class="sep"></div>
  <button id="next" title="next variant (→)">▶</button>
  <div class="sep"></div>
  <button id="eye" title="reveal placeholder labels (L)">👁</button>
</div>

<script>
/* ==========================================================================
   1. FAKE DATA — shaped like the real API responses, values invented
   ========================================================================== */

const NOW       = new Date('2026-08-10T09:00:00+02:00');
const PAST_H    = 13;    // BSH measurement history is ~13 h, measured
const WATER_H   = 136;   // BSH curve horizon, measured at Husum
const WEATHER_H = 168;   // 7 days, locked on the map
const MHW = 672, MNW = 324;             // Husum, cm above gauge zero
const SUNRISE = 5.8, SUNSET = 21.2;     // August, Nordfriesland

const M2 = 12.4206;                     // semi-diurnal period, hours

function astro(t) {
  const mean = (MHW + MNW) / 2;
  const amp  = (MHW - MNW) / 2 * (1 + 0.16 * Math.cos(2 * Math.PI * (t + 26) / (14.77 * 24)));
  return mean + amp * Math.cos(2 * Math.PI * (t - 2.1) / M2);
}
// the storm. wind, rain and surge all hang off this one bump so the panels agree.
const STORM_T = 34, STORM_W = 17;
function stormBump(t) { return Math.exp(-Math.pow((t - STORM_T) / STORM_W, 2)); }
function surge(t) {
  return 82 * stormBump(t) + 11 * Math.sin(2 * Math.PI * t / 37) + 9;
}
function windMean(t) {
  return 4.2 + 13.5 * stormBump(t) + 2.1 * Math.sin(2 * Math.PI * (t - 5) / 26) + 1.0 * Math.sin(t / 3.1);
}
function windGust(t) { return windMean(t) * (1.38 + 0.10 * Math.sin(t / 5.2)); }
function windDir(t)  { return 236 + 62 * (1 / (1 + Math.exp(-(t - STORM_T) / 16))); } // veers SW → NW
function rainMM(t) {
  const showers = Math.max(0, Math.sin(2 * Math.PI * (t - 12) / 19)) ** 3;
  return +(showers * (0.5 + 4.2 * stormBump(t))).toFixed(2);
}
function rainProb(t) { return Math.round(Math.min(95, 8 + 78 * stormBump(t) + 22 * Math.max(0, Math.sin(2 * Math.PI * (t - 12) / 19)))); }
function temp(t) {
  const hod = ((NOW.getHours() + t) % 24 + 24) % 24;
  return +(17.5 + 4.2 * Math.sin(2 * Math.PI * (hod - 9) / 24) - 3.4 * stormBump(t)).toFixed(1);
}

// water series, 20-minute grid like BSH
const water = [];
for (let t = -PAST_H; t <= WATER_H + 1e-9; t += 1 / 3) {
  const a = astro(t);
  const p = { t, astro: a };
  if (t < -0.15) p.meas = a + surge(t) + 3 * Math.sin(t * 2.3);   // observed
  else           p.fc   = a + surge(t);                            // surge-corrected
  water.push(p);
}
// hourly weather, full 7 days
const wx = [];
for (let t = 0; t <= WEATHER_H; t++) {
  wx.push({ t, mean: windMean(t), gust: windGust(t), dir: windDir(t),
            mm: rainMM(t), prob: rainProb(t), temp: temp(t) });
}
// high / low water peaks from the drawn series
function peaks() {
  const out = [];
  for (let i = 1; i < water.length - 1; i++) {
    const v = p => (p.fc ?? p.meas ?? p.astro);
    const a = v(water[i - 1]), b = v(water[i]), c = v(water[i + 1]);
    if ((b > a && b >= c) || (b < a && b <= c)) {
      out.push({ t: water[i].t, v: b, hw: b > a, astro: water[i].astro });
    }
  }
  return out;
}
const PEAKS = peaks();

// clock label — Mooring writes times with a DOT, per issue #5
const clock = t => {
  const d = new Date(NOW.getTime() + t * 3600e3);
  return String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0');
};
const hourOfDay = t => ((NOW.getHours() + NOW.getMinutes() / 60 + t) % 24 + 24) % 24;
const dayIndex  = t => Math.floor((NOW.getHours() + NOW.getMinutes() / 60 + t) / 24);
const isNight   = t => { const h = hourOfDay(t); return h < SUNRISE || h > SUNSET; };

// per-day rollup for the coarse part of the week
const days = [];
for (let d = 0; d < 7; d++) {
  const inDay = wx.filter(p => dayIndex(p.t) === d);
  if (!inDay.length) continue;
  const pk = PEAKS.filter(p => dayIndex(p.t) === d);
  days.push({
    d,
    gust: Math.max(...inDay.map(p => p.gust)),
    mean: Math.max(...inDay.map(p => p.mean)),
    dir:  inDay[Math.floor(inDay.length / 2)].dir,
    mm:   +inDay.reduce((s, p) => s + p.mm, 0).toFixed(1),
    prob: Math.max(...inDay.map(p => p.prob)),
    tmax: Math.max(...inDay.map(p => p.temp)),
    tmin: Math.min(...inDay.map(p => p.temp)),
    peaks: pk,
    hasWater: inDay[0].t <= WATER_H,
    partialWater: inDay[0].t <= WATER_H && inDay[inDay.length - 1].t > WATER_H
  });
}

/* ==========================================================================
   2. TINY SVG HELPERS
   ========================================================================== */
const svgEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const path = (pts, close) => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + (close ? 'Z' : '');
// wind barb-free arrow: points where the wind is GOING (dir is where it comes FROM)
function arrow(x, y, dirFrom, size, fill) {
  const a = (dirFrom + 180) * Math.PI / 180;
  const dx = Math.sin(a), dy = -Math.cos(a);
  const tipx = x + dx * size, tipy = y + dy * size;
  const bx = x - dx * size, by = y - dy * size;
  const px = -dy, py = dx;
  return `<path d="M${tipx.toFixed(1)} ${tipy.toFixed(1)} L${(bx + px * size * .62).toFixed(1)} ${(by + py * size * .62).toFixed(1)} L${(bx - dx * size * .25).toFixed(1)} ${(by - dy * size * .25).toFixed(1)} L${(bx - px * size * .62).toFixed(1)} ${(by - py * size * .62).toFixed(1)} Z" fill="${fill}"/>`;
}
const hatch = (id, color) => `<pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${color}" stroke-width="1.6" opacity=".5"/></pattern>`;
// redacted word — used inside SVG where a label would sit
const phRect = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${c}" opacity=".22" class="svgph"/>`;

const P = (de) => `<span class="ph">${svgEsc(de)}</span>`; // placeholder word in HTML

/* ==========================================================================
   3. VARIANT A — stacked lanes, one shared x-axis, 48 h horizontal scroll
   ========================================================================== */
function VariantA() {
  const PXH = 15, H0 = -6, H1 = 48;                 // px per hour, window
  const W = (H1 - H0) * PXH, L = 0;
  const x = t => (t - H0) * PXH;

  const LANE = { sky: 16, wind: 74, rain: 40, water: 108, axis: 18 };
  const yWind0 = LANE.sky, yWind1 = yWind0 + LANE.wind;
  const yRain0 = yWind1 + 6, yRain1 = yRain0 + LANE.rain;
  const yWat0 = yRain1 + 8, yWat1 = yWat0 + LANE.water;
  const HT = yWat1 + LANE.axis;

  const inW = p => p.t >= H0 && p.t <= H1;
  // scale the lanes to what is actually in the window, else they sit half empty
  const gmax = Math.max(12, Math.ceil(Math.max(...wx.filter(inW).map(p => p.gust)) / 5) * 5);
  const yG = v => yWind1 - (v / gmax) * LANE.wind;
  const rmax = Math.max(1, Math.ceil(Math.max(...wx.filter(inW).map(p => p.mm)) * 2) / 2);
  const yR = v => yRain1 - (v / rmax) * LANE.rain;
  const wmin = 250, wmax = 820;
  const yW = v => yWat1 - ((v - wmin) / (wmax - wmin)) * LANE.water;
  const yPeakHW = yWat0 + 9, yPeakNW = yWat1 - 3;   // fixed label rows, no collisions

  const inWin = p => p.t >= H0 && p.t <= H1;
  const wxw = wx.filter(inWin), waw = water.filter(inWin);

  let s = '';
  s += `<defs>${hatch('hA', '#9aa3b0')}
    <linearGradient id="gustA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--wind-soft)" stop-opacity=".95"/>
      <stop offset="100%" stop-color="var(--wind-soft)" stop-opacity=".35"/>
    </linearGradient></defs>`;

  // night shading, drawn behind every lane so the lanes read as one axis
  for (let t = H0; t < H1; t += .5) {
    if (isNight(t)) s += `<rect x="${x(t)}" y="0" width="${PXH * .5 + .5}" height="${yWat1}" fill="var(--night)"/>`;
  }
  // midnight + day separators
  for (let t = H0; t <= H1; t++) {
    const h = hourOfDay(t);
    if (Math.abs(h - 0) < .01) s += `<line x1="${x(t)}" y1="0" x2="${x(t)}" y2="${yWat1}" stroke="var(--ink-3)" stroke-width="1" opacity=".45"/>`;
    else if (h % 6 < .01) s += `<line x1="${x(t)}" y1="${yWind0}" x2="${x(t)}" y2="${yWat1}" stroke="var(--line)" stroke-width="1"/>`;
  }

  // --- wind lane: gust→mean ribbon (one shape carries both numbers) ---
  const gustPts = wxw.map(p => [x(p.t), yG(p.gust)]);
  const meanPts = wxw.map(p => [x(p.t), yG(p.mean)]).reverse();
  s += `<path d="${path(gustPts.concat(meanPts), true)}" fill="url(#gustA)"/>`;
  s += `<path d="${path(wxw.map(p => [x(p.t), yG(p.mean)]))}" fill="none" stroke="var(--wind)" stroke-width="2.1"/>`;
  s += `<path d="${path(wxw.map(p => [x(p.t), yG(p.gust)]))}" fill="none" stroke="var(--wind)" stroke-width="1" opacity=".5" stroke-dasharray="1 2.4"/>`;
  for (let t = H0 + ((6 - ((H0 % 3) + 3) % 3) % 3); t <= H1; t += 3) {
    const p = wx.find(q => q.t === t); if (!p) continue;
    s += arrow(x(t), yWind0 + 9, p.dir, 5.4, 'var(--wind)');
  }
  [5, 10, 15, 20, 25].filter(v => v < gmax).forEach(v => s += `<line x1="0" y1="${yG(v)}" x2="${W}" y2="${yG(v)}" stroke="var(--wind)" stroke-width=".6" opacity=".22"/><text x="3" y="${yG(v) - 2}" font-size="8" fill="var(--wind)" opacity=".65" class="mono">${v}</text>`);
  s += `<text x="3" y="${yRain0 + 8}" font-size="8" fill="var(--rain)" opacity=".7" class="mono">${rmax} mm</text>`;

  // --- rain lane: probability behind, amount in front ---
  wxw.forEach(p => {
    const bw = PXH - 3.5;
    s += `<rect x="${x(p.t) - bw / 2}" y="${yRain1 - (p.prob / 100) * LANE.rain}" width="${bw}" height="${(p.prob / 100) * LANE.rain}" fill="var(--rain-soft)" opacity=".55" rx="1"/>`;
    if (p.mm > 0.02) s += `<rect x="${x(p.t) - bw / 2}" y="${yR(Math.min(p.mm, rmax))}" width="${bw}" height="${yRain1 - yR(Math.min(p.mm, rmax))}" fill="var(--rain)" rx="1"/>`;
  });

  // --- water lane: astronomical faint, forecast solid, difference shaded ---
  const aPts = waw.map(p => [x(p.t), yW(p.astro)]);
  const fPts = waw.filter(p => p.fc != null).map(p => [x(p.t), yW(p.fc)]);
  const mPts = waw.filter(p => p.meas != null).map(p => [x(p.t), yW(p.meas)]);
  // shaded surge = area between astronomical and the drawn level
  const drawn = waw.filter(p => p.fc != null || p.meas != null);
  const upper = drawn.map(p => [x(p.t), yW(p.fc ?? p.meas)]);
  const lower = drawn.map(p => [x(p.t), yW(p.astro)]).reverse();
  s += `<path d="${path(upper.concat(lower), true)}" fill="var(--surge-hi)" opacity=".26"/>`;
  s += `<path d="${path(aPts)}" fill="none" stroke="var(--astro)" stroke-width="1.3" stroke-dasharray="3 3" opacity=".9"/>`;
  s += `<path d="${path(mPts)}" fill="none" stroke="var(--sea)" stroke-width="2.4" opacity=".55"/>`;
  s += `<path d="${path(fPts)}" fill="none" stroke="var(--sea)" stroke-width="2.6"/>`;
  s += `<line x1="0" y1="${yW(MHW)}" x2="${W}" y2="${yW(MHW)}" stroke="var(--sea)" stroke-width=".7" opacity=".35" stroke-dasharray="6 4"/>`;
  s += `<text x="3" y="${yW(MHW) - 3}" font-size="8" fill="var(--sea)" opacity=".8" class="mono">${MHW}</text>`;
  PEAKS.filter(inWin).forEach(p => {
    const ly = p.hw ? yPeakHW : yPeakNW;
    s += `<circle cx="${x(p.t)}" cy="${yW(p.v)}" r="2.6" fill="var(--sea)"/>`;
    s += `<text x="${x(p.t)}" y="${ly}" font-size="10" text-anchor="middle" fill="var(--ink)" class="mono">${Math.round(p.v)}</text>`;
    s += `<text x="${x(p.t)}" y="${ly + (p.hw ? 9 : -9)}" font-size="8.5" text-anchor="middle" fill="var(--ink-3)" class="mono">${clock(p.t)}</text>`;
  });

  // --- axis + now line ---
  for (let t = H0; t <= H1; t++) {
    const h = Math.round(hourOfDay(t));
    if (h % 3 !== 0) continue;
    s += `<text x="${x(t)}" y="${yWat1 + 13}" font-size="9.5" text-anchor="middle" fill="var(--ink-3)" class="mono">${clock(t)}</text>`;
  }
  s += `<line x1="${x(0)}" y1="0" x2="${x(0)}" y2="${yWat1}" stroke="#d1683a" stroke-width="1.6"/>`;
  s += `<circle cx="${x(0)}" cy="3" r="3" fill="#d1683a"/>`;

  const chart = `<svg width="${W}" height="${HT}" viewBox="0 0 ${W} ${HT}">${s}</svg>`;

  // --- week strip: this is where the water horizon actually bites ---
  const dayRow = d => {
    const hw = d.peaks.filter(p => p.hw).slice(0, 2);
    const hwLines = hw.map(p => `<div class="mono tiny" style="color:var(--sea)">${clock(p.t)} <b>${Math.round(p.v)}</b> <span style="color:var(--surge-hi)">+${Math.round(p.v - p.astro)}</span></div>`).join('');
    const waterCell = !d.hasWater
      ? `<svg width="76" height="9"><rect width="76" height="9" fill="url(#hAw)" rx="2"/></svg>`
      : d.partialWater
        ? hwLines + `<svg width="40" height="9" style="margin-top:2px"><rect width="40" height="9" fill="url(#hAw)" rx="2"/></svg>`
        : hwLines;
    return `<tr style="border-top:1px solid var(--line)">
      <td style="width:44px;padding:7px 0"><div class="tiny" style="font-weight:600">${P(['Mo','Di','Mi','Do','Fr','Sa','So'][d.d % 7])}</div><div class="tiny mono" style="color:var(--ink-3)">${new Date(NOW.getTime() + d.d * 864e5).getDate()}.8.</div></td>
      <td style="width:74px"><svg width="70" height="26">${arrow(9, 13, d.dir, 5.5, 'var(--wind)')}<text x="20" y="17" font-size="13" class="mono" fill="var(--ink)">${Math.round(d.mean)}</text><text x="38" y="17" font-size="11" class="mono" fill="var(--ink-3)">${Math.round(d.gust)}</text></svg></td>
      <td style="width:70px"><span class="mono" style="font-size:12px;color:var(--rain)">${d.mm.toFixed(1)}</span> <span class="tiny" style="color:var(--ink-3)">mm</span><br><span class="tiny mono" style="color:var(--ink-3)">${d.prob}%</span></td>
      <td>${waterCell}</td>
    </tr>`;
  };

  return `
  <svg width="0" height="0"><defs>${hatch('hAw', '#a8b0bc')}</defs></svg>
  <header>
    <div class="place ph">Husum</div>
    <div class="place-sub ph">Husum, Nordfriesland</div>
    <div class="stamp mono">${clock(0)} · ${P('Stand')}</div>
  </header>
  <div class="pad">
    <div class="now-row" style="margin-bottom:10px">
      <div class="now-cell"><div class="now-val mono">${Math.round(wx[0].mean)}<span class="now-unit"> / ${Math.round(wx[0].gust)} m/s</span></div><div class="now-cap"><svg width="11" height="11" style="display:inline;vertical-align:-1px">${arrow(5.5, 5.5, wx[0].dir, 4.6, 'var(--wind)')}</svg> ${P('Wind')}</div></div>
      <div class="now-cell"><div class="now-val mono">${Math.round(astro(0) + surge(0))}<span class="now-unit"> cm</span></div><div class="now-cap" style="color:var(--surge-hi)">+${Math.round(surge(0))} ${P('über')}</div></div>
    </div>

    <div class="card" style="padding:10px 8px 8px">
      <div class="lane-label" style="margin-left:6px">${P('Heute und morgen')}</div>
      <div class="scroller" id="scrollA">${chart}</div>
      <div class="tiny" style="display:flex;gap:10px;margin:6px 0 0 6px;color:var(--ink-3)">
        <span><svg width="16" height="6" style="vertical-align:1px"><line x1="0" y1="3" x2="16" y2="3" stroke="var(--sea)" stroke-width="2.4"/></svg> ${P('erwartet')}</span>
        <span><svg width="16" height="6" style="vertical-align:1px"><line x1="0" y1="3" x2="16" y2="3" stroke="var(--astro)" stroke-width="1.4" stroke-dasharray="3 3"/></svg> ${P('berechnet')}</span>
      </div>
    </div>

    <div class="card">
      <div class="lane-label">${P('Die Woche')}</div>
      <table class="rows">${days.map(dayRow).join('')}</table>
      <div class="tiny" style="color:var(--ink-3);margin-top:8px;display:flex;gap:6px;align-items:center">
        <svg width="22" height="10" style="flex:none"><rect width="22" height="10" fill="url(#hAw)" rx="2"/></svg>
        ${P('kein Wasserstand nach +5,7 Tagen')}
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   4. VARIANT B — ONE chart, layered encodings, squeezed (non-linear) axis.
      The whole page stops at the water horizon; the leftover weather days
      are exiled to a strip below.
   ========================================================================== */
function VariantB() {
  const W = 358, PADL = 26, PADR = 8;
  const BOX = { y0: 26, h: 300 };
  const y1 = BOX.y0 + BOX.h;
  const HT = y1 + 40;
  const T0 = -6, T1 = WATER_H;

  // piecewise time scale: the past gets 8%, today 40%, the rest 52%
  const iw = W - PADL - PADR;
  function x(t) {
    if (t <= 0)  return PADL + iw * 0.08 * ((t - T0) / (0 - T0));
    if (t <= 24) return PADL + iw * (0.08 + 0.40 * (t / 24));
    return PADL + iw * (0.48 + 0.52 * ((t - 24) / (T1 - 24)));
  }

  const wmin = 240, wmax = 820;
  const yW = v => y1 - ((v - wmin) / (wmax - wmin)) * BOX.h;
  const gmax = 30;
  const yG = v => y1 - 40 - (v / gmax) * (BOX.h - 90);   // wind rides the upper part
  const rmax = 4.5, RH = 54;
  const yR = v => BOX.y0 + (v / rmax) * RH;               // rain hangs from the top

  const waw = water.filter(p => p.t >= T0);
  const wxw = wx.filter(p => p.t >= T0 && p.t <= T1);

  let s = '';
  s += `<defs>${hatch('hB', '#9aa3b0')}
    <linearGradient id="seaB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--sea)" stop-opacity=".30"/>
      <stop offset="100%" stop-color="var(--sea)" stop-opacity=".08"/>
    </linearGradient>
    <clipPath id="boxB"><rect x="${PADL}" y="${BOX.y0}" width="${iw}" height="${BOX.h}"/></clipPath></defs>`;

  for (let t = T0; t < T1; t += .5) if (isNight(t)) s += `<rect x="${x(t)}" y="${BOX.y0}" width="${Math.max(.6, x(t + .5) - x(t))}" height="${BOX.h}" fill="var(--night)"/>`;
  for (let d = 0; d <= 6; d++) {
    const t = d * 24 - (NOW.getHours() + NOW.getMinutes() / 60);
    if (t < T0 || t > T1) continue;
    s += `<line x1="${x(t)}" y1="${BOX.y0}" x2="${x(t)}" y2="${y1}" stroke="var(--ink-3)" stroke-width=".8" opacity=".4"/>`;
  }

  // sea body first — it anchors the bottom, so wind above it stays legible
  const seaTop = waw.filter(p => p.fc != null || p.meas != null).map(p => [x(p.t), yW(p.fc ?? p.meas)]);
  s += `<path d="${path(seaTop.concat([[x(waw[waw.length - 1].t), y1], [x(T0), y1]]), true)}" fill="url(#seaB)" clip-path="url(#boxB)"/>`;
  const drawn = waw.filter(p => p.fc != null || p.meas != null);
  s += `<path d="${path(drawn.map(p => [x(p.t), yW(p.fc ?? p.meas)]).concat(drawn.map(p => [x(p.t), yW(p.astro)]).reverse()), true)}" fill="var(--surge-hi)" opacity=".32" clip-path="url(#boxB)"/>`;
  s += `<path d="${path(waw.map(p => [x(p.t), yW(p.astro)]))}" fill="none" stroke="var(--astro)" stroke-width="1.1" stroke-dasharray="3 3" clip-path="url(#boxB)"/>`;
  s += `<path d="${path(drawn.map(p => [x(p.t), yW(p.fc ?? p.meas)]))}" fill="none" stroke="var(--sea)" stroke-width="2" clip-path="url(#boxB)"/>`;

  // wind layered on top of the same box
  s += `<path d="${path(wxw.map(p => [x(p.t), yG(p.gust)]).concat(wxw.map(p => [x(p.t), yG(p.mean)]).reverse()), true)}" fill="var(--wind)" opacity=".18" clip-path="url(#boxB)"/>`;
  s += `<path d="${path(wxw.map(p => [x(p.t), yG(p.mean)]))}" fill="none" stroke="var(--wind)" stroke-width="2" clip-path="url(#boxB)"/>`;
  for (let t = 0; t <= T1; t += 6) {
    const p = wx.find(q => q.t === t); if (!p) continue;
    s += arrow(x(t), yG(p.gust) - 9, p.dir, 4.4, 'var(--wind)');
  }

  // rain hanging from the top edge
  wxw.forEach((p, i) => {
    if (p.mm < .02) return;
    const bw = Math.max(1.4, (x(p.t + 1) - x(p.t)) - 1);
    s += `<rect x="${x(p.t) - bw / 2}" y="${BOX.y0}" width="${bw}" height="${yR(Math.min(p.mm, rmax)) - BOX.y0}" fill="var(--rain)" opacity=".85"/>`;
  });

  // y axis for water only — the wind scale is deliberately unlabelled here
  [400, 500, 600, 700].forEach(v => {
    s += `<line x1="${PADL}" y1="${yW(v)}" x2="${W - PADR}" y2="${yW(v)}" stroke="var(--line)" stroke-width=".7"/>`;
    s += `<text x="${PADL - 4}" y="${yW(v) + 3}" font-size="8.5" text-anchor="end" fill="var(--ink-3)" class="mono">${v}</text>`;
  });
  s += `<line x1="${PADL}" y1="${yW(MHW)}" x2="${W - PADR}" y2="${yW(MHW)}" stroke="var(--sea)" stroke-width=".8" opacity=".5" stroke-dasharray="5 4"/>`;

  // day labels along the bottom, positioned by the squeezed scale
  for (let d = 0; d < 6; d++) {
    const t0 = Math.max(T0, d * 24 - (NOW.getHours() + NOW.getMinutes() / 60));
    const t1 = Math.min(T1, (d + 1) * 24 - (NOW.getHours() + NOW.getMinutes() / 60));
    if (t1 <= t0) continue;
    s += `<text x="${(x(t0) + x(t1)) / 2}" y="${y1 + 14}" font-size="9.5" text-anchor="middle" fill="var(--ink-2)" class="mono">${['Mo','Di','Mi','Do','Fr','Sa','So'][d % 7]}</text>`;
  }
  // today's hours only, because that's the stretched part
  [6, 12, 18].forEach(h => {
    const t = h - (NOW.getHours() + NOW.getMinutes() / 60);
    if (t < 0 || t > 24) return;
    s += `<text x="${x(t)}" y="${y1 + 26}" font-size="8.5" text-anchor="middle" fill="var(--ink-3)" class="mono">${String(h).padStart(2, '0')}.00</text>`;
  });
  // the squeeze made visible
  s += `<line x1="${x(24)}" y1="${BOX.y0}" x2="${x(24)}" y2="${y1 + 4}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="2 2" opacity=".7"/>`;
  s += `<text x="${x(24) + 3}" y="${BOX.y0 - 4}" font-size="8" fill="var(--ink-3)">⟩⟩</text>`;
  s += `<line x1="${x(0)}" y1="${BOX.y0 - 6}" x2="${x(0)}" y2="${y1}" stroke="#d1683a" stroke-width="1.6"/><circle cx="${x(0)}" cy="${BOX.y0 - 6}" r="3" fill="#d1683a"/>`;
  // the wall
  s += `<line x1="${x(T1)}" y1="${BOX.y0}" x2="${x(T1)}" y2="${y1}" stroke="var(--ink-2)" stroke-width="1.2"/>`;

  const chart = `<svg width="${W}" height="${HT}" viewBox="0 0 ${W} ${HT}">${s}</svg>`;

  // the exiled tail: weather days that outrun the water data
  const tail = days.filter(d => !d.hasWater || d.partialWater);
  const tailCards = tail.map(d => `
    <div style="flex:1;background:var(--bg);border-radius:10px;padding:8px 6px;text-align:center">
      <div class="tiny" style="font-weight:600">${P(['Mo','Di','Mi','Do','Fr','Sa','So'][d.d % 7])}</div>
      <svg width="100%" height="18" viewBox="0 0 40 18">${arrow(8, 9, d.dir, 5, 'var(--wind)')}<text x="18" y="13" font-size="12" class="mono" fill="var(--ink)">${Math.round(d.mean)}</text></svg>
      <div class="tiny mono" style="color:var(--rain)">${d.mm.toFixed(1)} mm</div>
      <div class="tiny mono" style="color:var(--nodata);margin-top:3px">${d.partialWater ? '↦ —' : '— — —'}</div>
    </div>`).join('');

  return `
  <header>
    <div class="place ph">Husum</div>
    <div class="place-sub ph">Husum, Nordfriesland</div>
    <div class="stamp mono">${clock(0)}</div>
  </header>
  <div class="pad">
    <div class="card" style="padding:8px 4px 4px">
      <div style="display:flex;gap:8px;padding:2px 8px 6px">
        <div style="flex:1"><div class="mono" style="font-size:19px;font-weight:650">${Math.round(wx[0].mean)}<span class="now-unit"> / ${Math.round(wx[0].gust)}</span></div><div class="tiny" style="color:var(--wind)">${P('Wind m/s')}</div></div>
        <div style="flex:1"><div class="mono" style="font-size:19px;font-weight:650">${Math.round(astro(0) + surge(0))}<span class="now-unit"> cm</span></div><div class="tiny" style="color:var(--surge-hi)">+${Math.round(surge(0))}</div></div>
        <div style="flex:1"><div class="mono" style="font-size:19px;font-weight:650">${wx[0].mm.toFixed(1)}<span class="now-unit"> mm</span></div><div class="tiny" style="color:var(--rain)">${wx[0].prob}%</div></div>
      </div>
      ${chart}
    </div>
    <div class="card">
      <div class="lane-label">${P('Danach — ohne Wasserstand')}</div>
      <div style="display:flex;gap:6px">${tailCards}</div>
    </div>
  </div>`;
}

/* ==========================================================================
   5. VARIANT C — time runs DOWN the page. One row per hour, thumb-scrolled.
   ========================================================================== */
function VariantC() {
  const CW = 358;
  const ROWH = 26;
  const gmax = 26, rmax = 4.5;
  const wlo = 280, whi = 780;

  function hourRow(p) {
    const w = water.reduce((best, q) => Math.abs(q.t - p.t) < Math.abs(best.t - p.t) ? q : best, water[0]);
    const lvl = w.fc ?? w.meas, ast = w.astro;
    const bx0 = 246, bw = 96;
    const xw = v => bx0 + ((v - wlo) / (whi - wlo)) * bw;
    const night = isNight(p.t);
    let g = '';
    if (night) g += `<rect x="0" y="0" width="${CW}" height="${ROWH}" fill="var(--night)"/>`;
    // time
    g += `<text x="4" y="${ROWH / 2 + 4}" font-size="11.5" fill="${night ? 'var(--ink-3)' : 'var(--ink-2)'}" class="mono">${clock(p.t)}</text>`;
    // wind: arrow + mean number + gust whisker
    g += arrow(48, ROWH / 2, p.dir, 5.6, 'var(--wind)');
    g += `<text x="60" y="${ROWH / 2 + 5}" font-size="14" fill="var(--ink)" class="mono">${Math.round(p.mean)}</text>`;
    const gw0 = 80, gww = 58;
    g += `<line x1="${gw0}" y1="${ROWH / 2}" x2="${gw0 + gww * (p.mean / gmax)}" y2="${ROWH / 2}" stroke="var(--wind)" stroke-width="4" stroke-linecap="round"/>`;
    g += `<line x1="${gw0 + gww * (p.mean / gmax)}" y1="${ROWH / 2}" x2="${gw0 + gww * (p.gust / gmax)}" y2="${ROWH / 2}" stroke="var(--wind-soft)" stroke-width="4" stroke-linecap="round"/>`;
    g += `<text x="${gw0 + gww + 4}" y="${ROWH / 2 + 4}" font-size="10.5" fill="var(--ink-3)" class="mono">${Math.round(p.gust)}</text>`;
    // rain: bead sized + coloured by amount, probability as a thin under-rule
    if (p.mm > .02) {
      const r = 2.2 + 5 * Math.min(1, p.mm / rmax);
      g += `<circle cx="${216}" cy="${ROWH / 2 - 1}" r="${r}" fill="var(--rain)" opacity=".9"/>`;
      g += `<text x="${227}" y="${ROWH / 2 + 4}" font-size="9.5" fill="var(--rain)" class="mono">${p.mm.toFixed(1)}</text>`;
    }
    g += `<line x1="204" y1="${ROWH - 3}" x2="${204 + 30 * (p.prob / 100)}" y2="${ROWH - 3}" stroke="var(--rain-soft)" stroke-width="2"/>`;
    // water: astronomical is a tick, the bar runs to the expected level.
    if (p.t <= WATER_H) {
      g += `<line x1="${bx0}" y1="${ROWH / 2 - 8}" x2="${bx0}" y2="${ROWH / 2 + 8}" stroke="var(--line)" stroke-width="1"/>`;
      g += `<line x1="${bx0 + bw * ((MHW - wlo) / (whi - wlo))}" y1="1" x2="${bx0 + bw * ((MHW - wlo) / (whi - wlo))}" y2="${ROWH - 1}" stroke="var(--sea)" stroke-width=".8" opacity=".3" stroke-dasharray="2 2"/>`;
      g += `<line x1="${bx0}" y1="${ROWH / 2}" x2="${xw(ast)}" y2="${ROWH / 2}" stroke="var(--sea-soft)" stroke-width="5" stroke-linecap="butt"/>`;
      g += `<line x1="${xw(ast)}" y1="${ROWH / 2}" x2="${xw(lvl)}" y2="${ROWH / 2}" stroke="var(--surge-hi)" stroke-width="5" stroke-linecap="butt"/>`;
      g += `<line x1="${xw(ast)}" y1="${ROWH / 2 - 6}" x2="${xw(ast)}" y2="${ROWH / 2 + 6}" stroke="var(--astro)" stroke-width="1.4"/>`;
      g += `<text x="${CW - 3}" y="${ROWH / 2 + 4}" font-size="10.5" text-anchor="end" fill="var(--ink-2)" class="mono">${Math.round(lvl)}</text>`;
    } else {
      g += `<rect x="${bx0}" y="${ROWH / 2 - 3}" width="${bw + 10}" height="6" fill="url(#hC)" rx="1"/>`;
    }
    return `<svg width="${CW}" height="${ROWH}" style="border-bottom:1px solid var(--line)">${g}</svg>`;
  }

  const daySep = d => `<div style="position:sticky;top:0;background:var(--card);z-index:2;padding:7px 4px 5px;border-bottom:1px solid var(--ink-3);display:flex;gap:8px;align-items:baseline">
      <b class="ph" style="font-size:13px">${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'][d % 7]}</b>
      <span class="tiny mono" style="color:var(--ink-3)">${new Date(NOW.getTime() + d * 864e5).getDate()}.8.</span>
    </div>`;

  // hourly rows for today + tomorrow, then day rollups
  let body = '', lastDay = -1;
  wx.filter(p => p.t <= 39).forEach(p => {
    const d = dayIndex(p.t);
    if (d !== lastDay) { body += daySep(d); lastDay = d; }
    body += hourRow(p);
  });

  const rollup = d => {
    const pk = d.peaks.filter(p => p.hw).slice(0, 2);
    return `<div style="display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line)">
      <div style="width:52px"><div class="tiny ph" style="font-weight:600">${['Mo','Di','Mi','Do','Fr','Sa','So'][d.d % 7]}</div><div class="tiny mono" style="color:var(--ink-3)">${new Date(NOW.getTime() + d.d * 864e5).getDate()}.8.</div></div>
      <svg width="86" height="20">${arrow(8, 10, d.dir, 5.4, 'var(--wind)')}<text x="19" y="15" font-size="14" class="mono" fill="var(--ink)">${Math.round(d.mean)}</text><line x1="40" y1="10" x2="${40 + 34 * (d.mean / 26)}" y2="10" stroke="var(--wind)" stroke-width="4" stroke-linecap="round"/><line x1="${40 + 34 * (d.mean / 26)}" y1="10" x2="${40 + 34 * (d.gust / 26)}" y2="10" stroke="var(--wind-soft)" stroke-width="4" stroke-linecap="round"/></svg>
      <div style="width:52px"><span class="mono" style="font-size:12px;color:var(--rain)">${d.mm.toFixed(1)}</span><div class="tiny mono" style="color:var(--ink-3)">${d.prob}%</div></div>
      <div style="flex:1;text-align:right">${pk.length
        ? pk.map(p => `<div class="tiny mono" style="color:var(--sea)">${clock(p.t)} <b>${Math.round(p.v)}</b> <span style="color:var(--surge-hi)">+${Math.round(p.v - p.astro)}</span></div>`).join('')
        : `<svg width="70" height="9"><rect width="70" height="9" fill="url(#hC2)" rx="2"/></svg>`}</div>
    </div>`;
  };

  return `
  <svg width="0" height="0"><defs>${hatch('hC', '#c6ccd6')}${hatch('hC2', '#c6ccd6')}</defs></svg>
  <header style="padding-bottom:6px">
    <div class="place ph">Husum</div>
    <div class="place-sub ph">Husum, Nordfriesland</div>
  </header>
  <div class="pad">
    <div class="card" style="padding:11px 12px">
      <div style="display:flex;align-items:flex-end;gap:12px">
        <div><div class="mono" style="font-size:30px;font-weight:650;line-height:1">${Math.round(wx[0].mean)}</div><div class="tiny" style="color:var(--wind)">${P('Wind m/s')} · ${Math.round(wx[0].gust)}</div></div>
        <svg width="30" height="30">${arrow(15, 15, wx[0].dir, 11, 'var(--wind)')}</svg>
        <div style="margin-left:auto;text-align:right">
          <div class="mono" style="font-size:22px;font-weight:650;line-height:1">${Math.round(astro(0) + surge(0))}<span class="now-unit"> cm</span></div>
          <div class="tiny mono" style="color:var(--surge-hi)">+${Math.round(surge(0))} ${P('über berechnet')}</div>
        </div>
      </div>
    </div>
    <div class="card" style="padding:0 12px 4px">
      ${body}
    </div>
    <div class="card">
      <div class="lane-label">${P('Weitere Tage')}</div>
      ${days.filter(d => d.d >= 2).map(rollup).join('')}
    </div>
  </div>`;
}

/* ==========================================================================
   6. SWITCHER
   ========================================================================== */
const VARIANTS = {
  A: { name: 'Stacked lanes, 48 h scroll',      render: VariantA },
  B: { name: 'One layered chart, squeezed axis', render: VariantB },
  C: { name: 'Vertical time, a row per hour',    render: VariantC }
};
const KEYS = Object.keys(VARIANTS);

function current() {
  const v = new URLSearchParams(location.search).get('variant');
  return KEYS.includes(v) ? v : 'A';
}
function go(k) {
  const u = new URL(location.href);
  u.searchParams.set('variant', k);
  history.replaceState(null, '', u);
  draw();
}
function draw() {
  const k = current();
  document.getElementById('app').innerHTML = VARIANTS[k].render();
  document.getElementById('vname').textContent = VARIANTS[k].name;
  document.getElementById('vkey').textContent = `variant ${k} · ${KEYS.indexOf(k) + 1} of ${KEYS.length} · L = labels`;
  const sc = document.getElementById('scrollA');
  if (sc) sc.scrollLeft = 6 * 15 - 20;   // park "now" near the left edge
}
const step = d => go(KEYS[(KEYS.indexOf(current()) + d + KEYS.length) % KEYS.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('eye').onclick = () => {
  document.body.classList.toggle('reveal');
  document.getElementById('bar').classList.toggle('reveal-on');
};
addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); step(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  if (e.key.toLowerCase() === 'l') document.getElementById('eye').click();
});
draw();
</script>
</body>
</html>
